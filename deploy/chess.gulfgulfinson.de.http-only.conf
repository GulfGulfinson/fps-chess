# Stage 1 of /etc/nginx/sites-available/chess.gulfgulfinson.de.conf: only what certbot's webroot challenge needs.
server {
    listen 80;
    listen [::]:80;
    server_name chess.gulfgulfinson.de;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
