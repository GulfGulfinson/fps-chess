# /etc/nginx/sites-available/chess.gulfgulfinson.de.conf
# Symlinked from sites-enabled/ (that directory holds symlinks only).
#
# - WebSocket upgrades on / go to the FPS Chess match server on 127.0.0.1:3107.
# - Plain requests get a small static page with Impressum and Datenschutz (legal adapter "chess").
# - No add_header here: the central security headers from nginx.conf apply (inheritance is all-or-nothing).
# - Long timeouts: a game connection stays open for the whole match; the server sends a keepalive
#   every 20 s, well inside Cloudflare's 100 s idle limit.

map $http_upgrade $chess_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name chess.gulfgulfinson.de;

    # Must match before the redirect, or certificate renewal silently stops working.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chess.gulfgulfinson.de;

    ssl_certificate     /etc/letsencrypt/live/chess.gulfgulfinson.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chess.gulfgulfinson.de/privkey.pem;

    root /home/pschneid/websites/chess.gulfgulfinson.de/public;

    location = / {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $chess_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        if ($http_upgrade = "websocket") {
            proxy_pass http://127.0.0.1:3107;
        }
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri.html =404;
    }
}
